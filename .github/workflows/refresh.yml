name: Daily jobs refresh

on:
  schedule:
    - cron: "41 4 * * *"   # every day at 04:41 UTC
  workflow_dispatch: {}     # "Run workflow" button for an on-demand refresh

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pycountry
      - name: Refresh jobs and rebuild the site
        run: python pipeline/refresh.py
      - name: Commit and push changes
        run: |
          git config user.name "jobs-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A index.html jobs data .gitignore
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily jobs refresh $(date -u +%Y-%m-%d)"
          git push
